<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Pelikan Eğitim Kurumları</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1A237E, #FFA000);
      display: flex;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    #readingText {
      display: none;
      text-align: justify;
      margin-top: 20px;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 20px;
      background: #F57C00;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Okuma Metni</h2>

  <p id="readingText"></p>

  <button class="btn" id="startBtn">Okumaya Başla</button>
  <button class="btn" id="finishBtn" style="display:none;">Bitirdim</button>

  <p id="timer" style="display:none;">0 sn</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "okuma-testi.firebaseapp.com",
  projectId: "okuma-testi"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let startTime, interval;

const startBtn = document.getElementById("startBtn");
const finishBtn = document.getElementById("finishBtn");

// 🔥 EVENT BAĞLAMA (KRİTİK)
startBtn.addEventListener("click", startReading);
finishBtn.addEventListener("click", finishReading);

function startReading() {
  const text = sessionStorage.getItem("metin");

  if (!text) {
    alert("Metin yok! Baştan gir.");
    window.location.href = "index.html";
    return;
  }

  document.getElementById("readingText").innerText = text;
  document.getElementById("readingText").style.display = "block";

  startBtn.style.display = "none";
  finishBtn.style.display = "inline-block";
  document.getElementById("timer").style.display = "block";

  startTime = Date.now();

  interval = setInterval(() => {
    const sec = Math.floor((Date.now() - startTime) / 1000);
    document.getElementById("timer").innerText = sec + " sn";
  }, 1000);
}

async function finishReading() {
  clearInterval(interval);

  const totalSec = Math.floor((Date.now() - startTime) / 1000);
  const text = document.getElementById("readingText").innerText;
  const wordCount = text.split(/\s+/).length;

  const okumaHizi = Math.round((wordCount / totalSec) * 60);

  localStorage.setItem("readingTime", totalSec);
  localStorage.setItem("kelimeSayisi", wordCount);
  localStorage.setItem("okumaHizi", okumaHizi);

  // 🔥 FIREBASE
  const userId = localStorage.getItem("userId");

  if(userId){
    try{
      await updateDoc(doc(db, "demo_kayitlari", userId), {
        okumaSuresi: totalSec,
        kelimeSayisi: wordCount,
        okumaHizi: okumaHizi
      });
      console.log("Okuma verisi kaydedildi");
    }catch(err){
      console.error("Firebase hata:", err);
    }
  }

  window.location.href = "questions.html";
}
</script>

</body>
</html>
