<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pelikan Eğitim Kurumları</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #1A237E, #FFA000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      color: #0D47A1;
      font-size: 1.8rem;
    }

    p.description {
      margin-bottom: 2rem;
      color: #333;
    }

    label {
      font-weight: 600;
      color: #0D47A1;
      display: block;
      text-align: left;
      margin-top: 1rem;
    }

    input, select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-top: 0.3rem;
    }

    .kvkk {
      display: flex;
      gap: 10px;
      margin-top: 1rem;
      font-size: 13px;
      text-align: left;
    }

    button {
      background-color: #F57C00;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 6px;
      margin-top: 1.2rem;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }

    img.logo {
      width: 200px;
      margin-bottom: 1.2rem;
    }

    footer {
      margin-top: 2rem;
      color: #fff;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

<div class="container">
  <img src="logo.jpg" class="logo">

  <h1>Hızlı Okuma ve Anlama Testi</h1>
  <p class="description">Bilgilerinizi girerek teste başlayınız.</p>

  <form id="studentForm">

    <label>Ad Soyad</label>
    <input type="text" id="name" required>

    <label>Yaş</label>
    <input type="number" id="age" required>

    <label>Telefon</label>
    <input type="tel" id="phone" required>

    <label>Sınıf</label>
    <select id="sinif" required>
      <option value="">Seçiniz</option>
      <option value="3">3. Sınıf</option>
      <option value="4">4. Sınıf</option>
      <option value="5">5. Sınıf</option>
      <option value="6">6. Sınıf</option>
      <option value="7">7. Sınıf</option>
      <option value="8">8. Sınıf</option>
    </select>

    <div class="kvkk">
      <input type="checkbox" id="kvkk">
      <span>KVKK kapsamında verilerimin işlenmesine onay veriyorum.</span>
    </div>

    <button type="submit">Teste Başla</button>

  </form>
</div>

<footer>
  © 2025 Pelikan Eğitim Kurumları
</footer>

<script src="data.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "okuma-testi.firebaseapp.com",
  projectId: "okuma-testi"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function sinifToGrup(s){
  if(s==3||s==4) return "grup1";
  if(s==5||s==6) return "grup2";
  if(s==7||s==8) return "grup3";
}

document.getElementById('studentForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const age = Number(document.getElementById('age').value);
  const phone = document.getElementById('phone').value.trim();
  const sinif = document.getElementById('sinif').value;
  const kvkk = document.getElementById('kvkk').checked;

  if(!name || !age || !phone || !sinif){
    alert("Tüm alanları doldur!");
    return;
  }

  if(!kvkk){
    alert("KVKK onayı zorunlu!");
    return;
  }

  try {

    const docRef = await addDoc(collection(db, "demo_kayitlari"), {
      adSoyad: name,
      yas: age,
      telefon: phone,
      sinif: sinif,
      kvkkOnayi: true,
      kayitTarihi: serverTimestamp()
    });

    // 🔥 USER ID
    localStorage.setItem("userId", docRef.id);

    // Metin
    const grup = sinifToGrup(sinif);
    const data = veri[grup];

    sessionStorage.setItem("metin", data.text);
    sessionStorage.setItem("questions", JSON.stringify(data.questions));

    window.location.href = "reading.html";

  } catch(err){
    alert("Hata: " + err.message);
  }

});
</script>

</body>
</html>
