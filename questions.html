<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pelikan Eğitim Kurumları</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1A237E, #FFA000);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
    }

    h2 {
      text-align: center;
      color: #1A237E;
    }

    .question {
      margin-bottom: 20px;
    }

    .option {
      margin: 5px 0;
    }

    .btn {
      margin-top: 20px;
      padding: 12px;
      background-color: #FFA000;
      color: white;
      border-radius: 8px;
      border: none;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Okuma Soruları</h2>
  <form id="soruForm"></form>
  <button class="btn" id="submitBtn">Cevapları Kontrol Et</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "okuma-testi.firebaseapp.com",
  projectId: "okuma-testi"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 VERİYİ GÜVENLİ ÇEK
let raw = sessionStorage.getItem("questions");

if (!raw) {
  alert("Sorular bulunamadı! Baştan başlat.");
  window.location.href = "index.html";
}

let questions;

try {
  questions = JSON.parse(raw);
} catch {
  alert("Soru verisi bozuk!");
  window.location.href = "index.html";
}

if (!questions || questions.length === 0) {
  alert("Sorular boş!");
  window.location.href = "index.html";
}

const form = document.getElementById("soruForm");
const submitBtn = document.getElementById("submitBtn");

let dogruCevaplar = [];

// 🔥 SORULARI BAS
questions.forEach((q, index) => {
  dogruCevaplar.push(q.cevap);

  let html = `<div class="question">
    <p><strong>${index + 1}. ${q.soru}</strong></p>`;

  html += `
    <div class="option">
      <label>
        <input type="radio" name="soru${index}" value="">
        Boş bırak
      </label>
    </div>
  `;

  q.secenekler.forEach((secenek, i) => {
    html += `
      <div class="option">
        <label>
          <input type="radio" name="soru${index}" value="${i}">
          ${secenek}
        </label>
      </div>
    `;
  });

  html += `</div>`;
  form.innerHTML += html;
});

// 🔥 BUTON EVENT
submitBtn.addEventListener("click", kontrolEt);

// 🔥 KONTROL
async function kontrolEt() {

  let dogru = 0;
  let yanlis = 0;
  let eksikVar = false;

  dogruCevaplar.forEach((cevap, i) => {
    const secilen = document.querySelector(`input[name='soru${i}']:checked`);

    if (!secilen) {
      eksikVar = true;
      return;
    }

    const deger = secilen.value;

    if (deger === "") {
      // boş
    } else if (parseInt(deger) === cevap) {
      dogru++;
    } else {
      yanlis++;
    }
  });

  if (eksikVar) {
    alert("Tüm soruları işaretleyin (boş bırak dahil)");
    return;
  }

  const yuzde = ((dogru / dogruCevaplar.length) * 100).toFixed(1);

  localStorage.setItem("dogruSayisi", dogru);
  localStorage.setItem("yanlisSayisi", yanlis);
  localStorage.setItem("basariYuzdesi", yuzde);

  const userId = localStorage.getItem("userId");

  if(userId){
    try{
      await updateDoc(doc(db, "demo_kayitlari", userId), {
        dogruSayisi: dogru,
        yanlisSayisi: yanlis,
        basariYuzdesi: Number(yuzde),
        tamamlandi: true,
        bitisTarihi: new Date()
      });
    }catch(err){
      console.error("Firebase hata:", err);
    }
  }

  window.location.href = "result.html";
}
</script>

</body>
</html>
